name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # The release workflow calls this one to get the binaries, so that the
  # dependency list and the build steps live in a single place — and so
  # that the tests are the gate in front of a release.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # The Linux runners need the webview stack to compile the desktop shell:
  # tao and wry reach into GTK, GLib and WebKitGTK.  The same list has to
  # be installed in both jobs, and a list written twice goes out of date
  # in one place only — so it is written once here.
  LINUX_DEPS: >-
    sudo apt-get update && sudo apt-get install -y --no-install-recommends
    pkg-config libssl-dev
    libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev
    libxcb-xfixes0-dev libxcb-composite0-dev
    libxkbcommon-dev libxkbcommon-x11-dev
    libwayland-dev libx11-dev
    libxrandr-dev libxcomposite-dev libxfixes-dev
    libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
    libayatana-appindicator3-dev librsvg2-dev
    libpipewire-0.3-dev libdbus-1-dev
    libgbm-dev libegl1-mesa-dev
    libclang-dev clang

jobs:
  # The whole test suite has to pass on every platform.  The suite is
  # platform-independent for the most part, so it runs everywhere rather
  # than on one platform only: the capture and input modules have
  # per-platform code that only compiles on its own platform, and a
  # matrix is the only way to catch it when someone edits it.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ${{ env.LINUX_DEPS }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check the workflow files
        if: runner.os == 'Linux'
        run: |
          # A workflow that does not parse is not a workflow that fails
          # loudly: GitHub rejects it and the run comes back with no jobs
          # at all.  actionlint says what is wrong instead.
          #
          # The check runs on Linux only.  The download script is bash,
          # and the Windows runner's bash is not the same bash — piping a
          # downloaded script into it failed there.
          curl -sfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            -o /tmp/download-actionlint.bash
          bash /tmp/download-actionlint.bash 1.7.7
          ./actionlint .github/workflows/*.yml

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

  # The desktop shell needs a webview engine.  On Linux that is GTK and
  # WebKitGTK, which the test job above can skip because the shell is
  # not compiled there.  This job builds the full binary on all three
  # platforms and uploads it so a person can try the thing.
  build:
    name: build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: ${{ env.LINUX_DEPS }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-release

      - name: Build release binary
        run: cargo build --workspace --release

      - name: Smoke test the command line
        shell: bash
        run: |
          # The window needs a display, and a CI runner has none, so the
          # smoke test stays on the command line: every subcommand has to
          # answer `--help` without touching a screen.
          ./target/release/skycremote --help
          ./target/release/skycremote tracker --help
          ./target/release/skycremote host --help
          ./target/release/skycremote control --help
          ./target/release/skycremote ui --help

      - name: Smoke test the tracker
        shell: bash
        run: |
          # The tracker is a plain HTTP service: it registers a device
          # and hands the address back.  It carries no session data, so
          # starting one here and asking it a question is safe.
          ./target/release/skycremote tracker --port 21115 &
          TRACKER_PID=$!
          trap 'kill $TRACKER_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:21115/health > /dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:21115/health
          echo
          curl -sf -X POST http://127.0.0.1:21115/register \
            -H 'content-type: application/json' \
            -d '{"id":"ci-device","name":"CI","port":21116}'
          echo
          curl -sf -X POST http://127.0.0.1:21115/peer \
            -H 'content-type: application/json' \
            -d '{"id":"ci-device"}'
          echo

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p skycremote-linux-x64
          cp target/release/skycremote skycremote-linux-x64/
          tar czf skycremote-linux-x64.tar.gz -C skycremote-linux-x64 skycremote

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p skycremote-macos-arm64
          cp target/release/skycremote skycremote-macos-arm64/
          tar czf skycremote-macos-arm64.tar.gz -C skycremote-macos-arm64 skycremote

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force skycremote-windows-x64 | Out-Null
          Copy-Item target/release/skycremote.exe skycremote-windows-x64/
          Compress-Archive -Path skycremote-windows-x64/* -DestinationPath skycremote-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: skycremote-${{ matrix.os }}
          path: |
            skycremote-linux-x64.tar.gz
            skycremote-macos-arm64.tar.gz
            skycremote-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
