[workspace]
resolver = "2"
members = ["crates/skycremote-core", "crates/skycremote-tracker", "crates/skycremote-app"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
rand = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.23"
sha2 = "0.11"
hkdf = "0.13"
aes-gcm = "0.11"
x25519-dalek = { version = "2", features = ["static_secrets"] }
getrandom = "0.3"
webrtc = "0.21"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log", "bloom"] }
axum = "0.8"
tower = "0.5"
hyper = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"
ring = "0.17"
xcap = "0.9"
display-info = "0.5"
image = "0.25"
imagepipe = "0.5"
ffmpeg-next = "9"
wry = "0.57"
raw-window-handle = "0.6"
parking_lot = "0.12"
crossbeam-channel = "0.5"
arc-swap = "1"
directories = "6"
time = "0.3"
clap = "4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
