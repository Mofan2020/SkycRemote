[package]
name = "skycremote-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SkycRemote: the program you run on both ends."

[[bin]]
name = "skycremote"
path = "src/main.rs"

[dependencies]
skycremote-core = { path = "../skycremote-core" }
skycremote-tracker = { path = "../skycremote-tracker" }
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
wry = "0.57"
tao = "0.37"
include_dir = "0.7"
bytes = "1"
base64 = "0.22"
