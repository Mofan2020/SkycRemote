[package]
name = "skycremote-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "The core of SkycRemote: capture, encode, transport, input."

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rand.workspace = true
base64.workspace = true
sha2.workspace = true
hkdf.workspace = true
aes-gcm.workspace = true
x25519-dalek.workspace = true
getrandom.workspace = true
reqwest.workspace = true
image.workspace = true
parking_lot.workspace = true
time.workspace = true

# Screen capture.  xcap owns the pixels; display-info is the second opinion
# on a screen's name, size and scale when xcap cannot answer.
xcap.workspace = true
display-info.workspace = true

# The default H.264 encoder.  Cisco's OpenH264 is compiled from the C source
# vendored in the crate, so it needs a C compiler but no system libraries,
# which is what lets a plain `cargo build` work on any machine.
openh264 = "0.9"

# The libx264 backend.  Optional because ffmpeg-next resolves the system's
# ffmpeg through pkg-config at build time, which not every machine can do;
# enable the `ffmpeg` feature to compile it.
ffmpeg-next = { workspace = true, optional = true }
rcgen = "0.14.10"
quinn.workspace = true
rustls.workspace = true

[features]
# Off by default so that `cargo build` never depends on a local ffmpeg
# installation.  Turn it on to get `Encoder::with_libx264`.
#
# Building with this feature needs ffmpeg's .pc files on pkg-config's search
# path, e.g. on macOS with Homebrew:
#   PKG_CONFIG_PATH="$(brew --prefix ffmpeg)/lib/pkgconfig" \
#     cargo build -p skycremote-core --features ffmpeg
ffmpeg = ["dep:ffmpeg-next"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
# The features are the ones the input injector needs: SendInput and the
# keyboard and mouse flags come from Win32_UI_Input_KeyboardAndMouse,
# the size of the desktop from Win32_UI_WindowsAndMessaging.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.100"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The X11 client library and its XTEST extension, loaded at run time
# rather than linked against, so a machine without them still builds —
# it just says so when it cannot inject.
x11-dl = "2"
