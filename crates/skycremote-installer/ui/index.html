<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安装 SkycRemote</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <header class="head">
    <div class="mark" id="mark"></div>
    <div class="titles">
      <h1>安装 SkycRemote</h1>
      <p class="sub" id="version">点对点远程桌面</p>
    </div>
  </header>

  <section class="field">
    <span class="field-label">装给谁</span>
    <div class="choices">
      <label class="choice">
        <input type="radio" name="scope" value="user" checked>
        <span class="choice-text">
          <span class="choice-title">只为我安装</span>
          <span class="choice-hint">装在你自己的账户下，不需要管理员密码。</span>
        </span>
      </label>
      <label class="choice">
        <input type="radio" name="scope" value="allUsers">
        <span class="choice-text">
          <span class="choice-title">为所有用户安装</span>
          <span class="choice-hint">装进「Program Files」，这台机器上的每个账户都能用。Windows 会问你要管理员权限。</span>
        </span>
      </label>
    </div>
  </section>

  <section class="field">
    <label for="path">安装位置</label>
    <input id="path" type="text" spellcheck="false" autocomplete="off">
    <p class="hint" id="path-hint">装在你自己的账户下，不需要管理员密码。</p>
  </section>

  <section class="list">
    <p class="list-title">装上这些</p>
    <ul>
      <li><span class="tick">✓</span>SkycRemote 桌面程序</li>
      <li><span class="tick">✓</span>命令行工具 skycremote，放进 PATH</li>
      <li><span class="tick">✓</span>开始菜单和桌面上的快捷方式</li>
      <li><span class="tick">✓</span>「应用和功能」里的卸载入口</li>
    </ul>
  </section>

  <p class="status" id="status" hidden></p>

  <footer class="actions">
    <button class="btn ghost" id="cancel" type="button">取消</button>
    <button class="btn primary" id="install" type="button">安装</button>
  </footer>
</main>

<script>
(function () {
  'use strict';

  var pending = {};
  var nextId = 1;

  function request(command, payload) {
    return new Promise(function (resolve, reject) {
      var id = nextId++;
      pending[id] = { resolve: resolve, reject: reject };
      window.ipc.postMessage(JSON.stringify({
        id: id,
        command: command,
        payload: JSON.stringify(payload || {})
      }));
    });
  }

  window.__skycremote_resolve__ = function (id, ok, result) {
    var entry = pending[id];
    if (!entry) return;
    delete pending[id];
    if (ok) entry.resolve(result);
    else entry.reject(new Error((result && result.message) || 'failed'));
  };

  var pathInput = document.getElementById('path');
  var status = document.getElementById('status');
  var installButton = document.getElementById('install');
  var cancelButton = document.getElementById('cancel');

  function say(text, kind) {
    status.textContent = text;
    status.className = 'status ' + (kind || 'info');
    status.hidden = false;
  }

  var defaults = { user: '', allUsers: '' };
  var scopeInputs = document.querySelectorAll('input[name="scope"]');

  function chosenScope() {
    for (var i = 0; i < scopeInputs.length; i++) {
      if (scopeInputs[i].checked) return scopeInputs[i].value;
    }
    return 'user';
  }

  // The path follows the choice: one person installs into their own
  // area, everybody installs into "Program Files".
  function applyScope(keepTyped) {
    var scope = chosenScope();
    if (!keepTyped) pathInput.value = defaults[scope] || '';
    var hint = document.getElementById('path-hint');
    if (hint) {
      hint.textContent = scope === 'allUsers'
        ? '装进 Program Files，这台机器上的每个账户都能用。Windows 会问你要管理员权限。'
        : '装在你自己的账户下，不需要管理员密码。';
    }
  }

  Array.prototype.forEach.call(scopeInputs, function (input) {
    input.addEventListener('change', function () {
      applyScope(false);
    });
  });

  request('defaultPath').then(function (result) {
    if (result && result.user) defaults.user = result.user;
    if (result && result.allUsers) defaults.allUsers = result.allUsers;
    applyScope(false);
    if (result && result.version) {
      document.getElementById('version').textContent = '点对点远程桌面 · v' + result.version;
    }
  }).catch(function () {});

  installButton.addEventListener('click', function () {
    var path = (pathInput.value || '').trim();
    if (!path) {
      say('请先填一个安装位置', 'error');
      return;
    }
    installButton.disabled = true;
    installButton.textContent = '安装中…';
    say('正在安装…', 'info');

    var scope = chosenScope();
    request('install', { path: path, scope: scope }).then(function (result) {
      if (result && result.ok) {
        installButton.textContent = '安装完成';
        cancelButton.textContent = '完成';
        if (scope === 'allUsers') {
          say(result.message || '装好了。命令行工具叫 skycremote，每个账户都能用。', 'ok');
        } else {
          say('装好了：' + result.path + '。命令行工具叫 skycremote，在终端里直接用。', 'ok');
        }
      } else {
        installButton.disabled = false;
        installButton.textContent = '安装';
        say((result && result.message) || '安装没有成功', 'error');
      }
    }).catch(function (error) {
      installButton.disabled = false;
      installButton.textContent = '安装';
      say(error.message || '安装没有成功', 'error');
    });
  });

  cancelButton.addEventListener('click', function () {
    request('close').catch(function () {});
  });
})();
</script>
</body>
</html>
